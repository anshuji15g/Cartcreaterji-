<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="baseVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="60%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>

    <!-- Glass Tile Face Gradient -->
    <linearGradient id="tileGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2538"/>
      <stop offset="40%" stop-color="#111724"/>
      <stop offset="100%" stop-color="#090d15"/>
    </linearGradient>

    <!-- App Tile Border Stroke -->
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.6)"/>
      <stop offset="30%" stop-color="rgba(255, 255, 255, 0.2)"/>
      <stop offset="70%" stop-color="rgba(0, 0, 0, 0.8)"/>
      <stop offset="100%" stop-color="rgba(0, 242, 254, 0.4)"/>
    </linearGradient>

    <!-- 3D Liquid Gold Metallic Ribbon Gradient -->
    <linearGradient id="liquidGold" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="25%" stop-color="#e5b443"/>
      <stop offset="50%" stop-color="#fff6cc"/>
      <stop offset="75%" stop-color="#b88318"/>
      <stop offset="100%" stop-color="#f5ce62"/>
    </linearGradient>

    <linearGradient id="goldShade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a5c00"/>
      <stop offset="50%" stop-color="#d4a024"/>
      <stop offset="100%" stop-color="#fff0aa"/>
    </linearGradient>

    <!-- Cyber Neon Cyan Metallic Ribbon -->
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#00bcd4"/>
      <stop offset="85%" stop-color="#006978"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Lighting & Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldDropShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" fill="url(#baseVignette)"/>

  <!-- Master Squircle App Icon Tile -->
  <g filter="url(#goldDropShadow)">
    <rect x="76" y="86" width="360" height="360" rx="72" fill="url(#tileGlass)" stroke="url(#tileBorder)" stroke-width="2.5"/>
    <!-- Glass Rim Highlight -->
    <rect x="78" y="88" width="356" height="180" rx="70" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  </g>

  <!-- Cyan Inner Ambient Light -->
  <circle cx="256" cy="275" r="110" fill="#00f2fe" opacity="0.12" filter="url(#softGlow)"/>

  <!-- ==================== PREMIUM 3D GOLD 'PRO' CROWN ==================== -->
  <g filter="url(#goldDropShadow)">
    <!-- Golden Infinity Base / Under-Loops -->
    <path d="M 160 145 C 130 145 110 120 125 95 C 145 65 200 95 256 122 C 312 95 367 65 387 95 C 402 120 382 145 352 145 C 305 145 275 110 256 110 C 237 110 207 145 160 145 Z" 
          fill="url(#goldShade)"/>
    
    <!-- Top Fluid Golden Arch -->
    <path d="M 132 102 C 146 76 195 98 256 124 C 317 98 366 76 380 102 C 392 122 375 138 350 138 C 300 138 270 94 256 94 C 242 94 212 138 162 138 C 137 138 120 122 132 102 Z" 
          fill="url(#liquidGold)" stroke="#ffeaa7" stroke-width="1.5"/>

    <!-- 'PRO' Embossed Metallic Typography -->
    <text x="256" y="122" 
          font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="27" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#3e2402" 
          text-anchor="middle" 
          opacity="0.95">PRO</text>
  </g>

  <!-- ==================== CYBER CART / VIRAL CYCLE ICON ==================== -->
  <g filter="url(#softGlow)">
    <!-- Cart Handle & Back Bar -->
    <path d="M 180 205 H 202 L 216 312 H 304" 
          fill="none" stroke="url(#cyanRibbon)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Flow Arrow (Top Right Entry) -->
    <path d="M 235 186 H 296 L 285 174 M 296 186 L 285 198" 
          fill="none" stroke="url(#cyanRibbon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Loop Upper & Right Curve with Tech Spur -->
    <path d="M 296 186 L 322 208 L 308 232" 
          fill="none" stroke="url(#cyanRibbon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- AI Turbo Engine Cog & Lightning Cutout (Right Flank) -->
    <path d="M 315 224 L 328 226 L 333 238 L 344 242 L 345 254 L 336 261 L 334 274 L 321 278 L 310 292 L 290 292" 
          fill="none" stroke="url(#cyanRibbon)" stroke-width="9" stroke-linejoin="round"/>

    <!-- Lightning Spark Icon inside Gear Area -->
    <path d="M 326 244 L 316 256 H 325 L 319 268" 
          fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lower Reverse Arrow Track (Cycle) -->
    <path d="M 310 292 L 242 292 L 254 304 M 242 292 L 254 280" 
          fill="none" stroke="url(#cyanRibbon)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner Core Loop Structure -->
    <path d="M 242 292 L 222 262 C 215 240 224 212 248 200 L 268 190" 
          fill="none" stroke="url(#cyanRibbon)" stroke-width="8" stroke-linecap="round"/>

    <!-- High-Gloss Wheels (Metallic Chrome Hubs + Neon Glow) -->
    <circle cx="230" cy="336" r="13" fill="#0b111e" stroke="url(#cyanRibbon)" stroke-width="6"/>
    <circle cx="230" cy="336" r="4.5" fill="#ffffff"/>

    <circle cx="295" cy="336" r="13" fill="#0b111e" stroke="url(#cyanRibbon)" stroke-width="6"/>
    <circle cx="295" cy="336" r="4.5" fill="#ffffff"/>
  </g>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <!-- "Cartcreaterji" Clean Modern Gradient Title -->
  <text x="256" y="394" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
        font-size="33" 
        font-weight="800" 
        letter-spacing="0.5" 
        fill="#ffffff" 
        text-anchor="middle">Cartcreaterji</text>
</svg>

