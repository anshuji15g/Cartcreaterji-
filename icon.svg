<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="70%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Metallic Gold PRO Ribbon -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="30%" stop-color="#e5b842"/>
      <stop offset="70%" stop-color="#8a5e05"/>
      <stop offset="100%" stop-color="#f3cb57"/>
    </linearGradient>

    <!-- Cyan Metallic Cart Track -->
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="15" y="15" width="482" height="482" rx="95" fill="none" stroke="rgba(0, 242, 254, 0.3)" stroke-width="3"/>

  <!-- 3D Gold PRO Infinity Loop Ribbon -->
  <g filter="url(#shadow)">
    <path d="M 160 140 C 120 140 100 100 130 80 C 160 60 210 90 256 115 C 302 90 352 60 382 80 C 412 100 392 140 352 140 C 295 140 268 95 256 95 C 244 95 217 140 160 140 Z" 
          fill="url(#gold)" stroke="#fff" stroke-width="1.5"/>
    
    <text x="256" y="116" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="26" 
          font-weight="900" 
          letter-spacing="6" 
          fill="#2b1a03" 
          text-anchor="middle">PRO</text>
  </g>

  <!-- Cyber Cart & Viral Growth Cycle -->
  <g filter="url(#shadow)">
    <!-- Cart Base Body -->
    <path d="M 185 200 H 210 L 225 315 H 305" 
          fill="none" stroke="url(#cyan)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dynamic Flow Arrow -->
    <path d="M 235 185 H 300 L 285 170 M 300 185 L 285 200" 
          fill="none" stroke="url(#cyan)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Gear Flank with Lightning Bolt -->
    <path d="M 310 220 L 325 225 L 330 238 L 342 245 L 340 260 L 328 270 L 315 285 L 290 285" 
          fill="none" stroke="url(#cyan)" stroke-width="10" stroke-linejoin="round"/>

    <polygon points="320,240 310,255 320,255 314,270 330,250 320,250" fill="#ffffff"/>

    <!-- Reverse Growth Cycle Arrow -->
    <path d="M 300 285 L 245 285 L 260 298 M 245 285 L 260 272" 
          fill="none" stroke="url(#cyan)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Metallic Wheels with Glowing Hubs -->
    <circle cx="230" cy="345" r="15" fill="#080e1a" stroke="url(#cyan)" stroke-width="7"/>
    <circle cx="230" cy="345" r="5" fill="#ffffff"/>

    <circle cx="295" cy="345" r="15" fill="#080e1a" stroke="url(#cyan)" stroke-width="7"/>
    <circle cx="295" cy="345" r="5" fill="#ffffff"/>
  </g>

  <!-- Title Typography -->
  <text x="256" y="415" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="1" 
        fill="#ffffff" 
        text-anchor="middle">Cartcreaterji</text>
</svg>

